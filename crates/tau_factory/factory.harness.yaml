# Example harness configuration for the tau agent factory.
#
# The factory is an out-of-tree tau extension: the harness launches it as a
# child process and speaks the extension protocol over stdio. To enable it,
# merge the block below into your `~/.config/tau/harness.yaml` (or drop this
# file into `~/.config/tau/harness.yaml.d/`).
#
# Build the binary first:
#     cargo build -p tau_factory --bin tau-factory
# which produces `<tau-gui>/target/debug/tau-factory`.

extensions:
  factory:
    # command[0] is the executable; point it at the built binary.
    command: ["/home/maan2003/src/tau-gui/target/debug/tau-factory"]
    enable: true
    config:
      # The repository the per-task jj workspaces share. Omit to default to
      # the harness process working directory. The factory keeps its durable
      # task store and the per-task workspaces under the harness-provided
      # state directory for this extension.
      repo_root: "/home/maan2003/src/tau-gui"

# Once enabled, the factory publishes two slash actions in any session:
#   /factory new <title>   — create a task
#   /factory start <id>    — create a jj workspace and start an agent on it
