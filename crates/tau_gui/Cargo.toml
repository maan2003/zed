[package]
name = "tau_gui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[[bin]]
name = "tau-gui"
path = "src/tau_gui.rs"

[dependencies]
anyhow.workspace = true
assets.workspace = true
base64 = { version = "0.22", default-features = false, features = ["std"] }
ciborium = { version = "0.2.2", default-features = false, features = ["std"] }
clap.workspace = true
command_palette.workspace = true
editor.workspace = true
gpui.workspace = true
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
language.workspace = true
multi_buffer.workspace = true
project.workspace = true
release_channel.workspace = true
search.workspace = true
semver.workspace = true
settings.workspace = true
tau-cli-term = { path = "../../../tau/crates/tau-cli-term" }
tau-config = { path = "../../../tau/crates/tau-config" }
tau-harness = { path = "../../../tau/crates/tau-harness" }
tau-themes = { path = "../../../tau/crates/tau-themes" }
text.workspace = true
tau-proto = { path = "../../../tau/crates/tau-proto" }
tau_task = { path = "../tau_task" }
theme.workspace = true
theme_settings.workspace = true
ui.workspace = true
vim.workspace = true

[dev-dependencies]
chrono.workspace = true
gpui = { workspace = true, features = ["test-support"] }
